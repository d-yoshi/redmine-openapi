name: Canary

on:
  schedule:
    - cron: "0 21 * * 0" # Monday 06:00 JST
  workflow_dispatch:
    inputs:
      notify:
        description: "Create or update Canary issues (otherwise show the summary only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  check:
    name: Find newer Redmine versions
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      plan: ${{ steps.detect.outputs.plan }}
      matrix: ${{ steps.detect.outputs.matrix }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/canary.mjs detect

  test:
    name: Test Redmine ${{ matrix.candidate }} (from ${{ matrix.target }})
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          path: spec
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: spec/.tool-versions
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - run: npm ci
        working-directory: tooling
      - name: Test the published specification against the candidate
        env:
          CANARY_CHECK: ${{ toJSON(matrix) }}
          CANARY_SOURCE_DIR: ${{ github.workspace }}/spec
          CANARY_RESULTS_DIR: ${{ runner.temp }}/canary-results
        run: node tooling/scripts/canary.mjs test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canary-result-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-results/*.json
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Summarize Canary results
    needs: [check, test]
    if: always() && needs.check.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        if: needs.test.result != 'skipped'
        id: results
        continue-on-error: true
        with:
          pattern: canary-result-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-results
          merge-multiple: true
          digest-mismatch: error
      - name: Summarize results and notify when requested
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_PLAN: ${{ needs.check.outputs.plan }}
          CANARY_CHECK_RESULT: ${{ needs.check.result }}
          CANARY_RESULTS_DIR: ${{ runner.temp }}/canary-results
          CANARY_DOWNLOAD_RESULT: ${{ steps.results.outcome }}
          CANARY_NOTIFY: ${{ github.event_name != 'workflow_dispatch' || inputs.notify }}
        run: node scripts/canary.mjs report
