name: Release diagnostics

on: workflow_dispatch

permissions:
  # Inspect Drafts with the same permission as the publisher; every request below is a GET.
  contents: write

jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Compare read-only Draft API responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const { spawnSync } = require('node:child_process');
          const prefix = `repos/${process.env.GITHUB_REPOSITORY}`;
          const routes = ['releases?per_page=100', 'releases/430605248', 'releases/430594849'];
          const summarize = (data) => Array.isArray(data)
            ? data.filter((entry) => entry.draft).map(summarize)
            : { id: data.id, tag_name: data.tag_name, name: data.name, draft: data.draft, author: data.author?.login, message: data.message };
          (async () => {
            for (const route of routes) {
              const result = spawnSync('gh', ['api', `${prefix}/${route}`], { encoding: 'utf8' });
              let body;
              try { body = summarize(JSON.parse(result.stdout)); } catch { body = { error: 'Non-JSON CLI response' }; }
              console.log(JSON.stringify({ client: 'gh', route, exit: result.status, body }));
            }
            const { GitHub } = await import('./scripts/release/github.mjs');
            const github = new GitHub({ repository: process.env.GITHUB_REPOSITORY, token: process.env.GH_TOKEN, apiUrl: process.env.GITHUB_API_URL });
            for (const id of [430605248, 430594849]) {
              try { console.log(JSON.stringify({ client: 'helper', id, body: summarize(await github.releaseById(id) ?? { message: 'not found' }) })); }
              catch (error) { console.log(JSON.stringify({ client: 'helper', id, error: error.message })); }
            }
            for (const version of ['2026-03-10', '2022-11-28']) {
              for (const scheme of ['Bearer', 'token']) {
                for (const route of routes) {
                  try {
                    const response = await fetch(`https://api.github.com/${prefix}/${route}`, {
                      headers: { Authorization: `${scheme} ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': version },
                      redirect: 'manual', signal: AbortSignal.timeout(15000),
                    });
                    console.log(JSON.stringify({ client: 'node', version, scheme, route, status: response.status, body: summarize(await response.json()) }));
                  } catch (error) { console.log(JSON.stringify({ client: 'node', version, scheme, route, error: error.message })); }
                }
              }
            }
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          JS
