name: CI

on:
  push:
    paths:
      - ".github/workflows/ci.yaml"
      - "src/**"
      - "redocly/**"
      - "test/**"
      # Tool versions live in the root manifest; a toolchain bump must not
      # merge with zero CI
      - "package.json"
      - "package-lock.json"
    tags-ignore:
      - "**"
    branches:
      - "**"
  pull_request:
    paths:
      - ".github/workflows/ci.yaml"
      - "src/**"
      - "redocly/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: bundle
        run: npm run bundle
      - name: lint
        run: npm run lint
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: openapi.yaml

  # No Docker: fails a PR on a shell lint, schema, spec or type error without
  # waiting for the integration job. run-test.sh runs the same script, so this is
  # earlier feedback rather than an extra gate.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: ./test/check.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      # Runs check.sh, then the suite, then check-api-coverage.mjs — so a failure
      # here can also mean a declared operation, response or query parameter is
      # unexercised
      - name: static checks, integration tests and API coverage
        run: ./test/run-test.sh

  # Informational: show changes against the latest release tag (never fails the build)
  spec-diff:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: oasdiff changelog against latest release tag
        run: |
          # Nearest release tag among the ancestors of HEAD (branch-aware).
          # The second pattern matches the retired format (transition period)
          PREV_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*-r[0-9]*' --match '*+redmine*' HEAD 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found; skipping diff." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "$PREV_TAG:openapi.yaml" > /tmp/previous.yaml
          npm run bundle
          {
            echo "## oasdiff changelog vs \`$PREV_TAG\`"
            echo '```'
            docker run --rm -v /tmp:/tmp -v "$PWD":/repo -w /repo tufin/oasdiff changelog /tmp/previous.yaml /repo/openapi.yaml || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  commit-bundle:
    if: github.event_name == 'push'
    needs:
      - bundle
      - static
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openapi
      - name: commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add openapi.yaml
          git diff-index --quiet HEAD openapi.yaml || (git commit -m "Update bundled file" && git push)
