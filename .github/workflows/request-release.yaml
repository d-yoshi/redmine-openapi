name: Request release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-r[0-9]+"
      - "*redmine*"

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Check the requested tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-r[1-9][0-9]*$ ]]; then
            echo '::error::Use a release tag in the form X.Y.Z-rN.'
            exit 1
          fi
