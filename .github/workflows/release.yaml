name: Release

# Creates a GitHub Release when a release tag (e.g. 6.1.3-r2) is pushed, then
# publishes the docs site so it always matches the latest release. Tags not on
# main (maintenance lines) are released with --latest=false and skip the docs
# jobs.
on:
  push:
    tags:
      # Current format: <redmine x.y.z>-rN
      - "[0-9]+.[0-9]+.[0-9]+-r[0-9]+"
      # Retired format — still triggers so an accidental old-style push fails
      # loudly at the format gate instead of silently creating nothing
      - "*redmine*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify tag format
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the release format '<redmine x.y.z>-r<N>' (N starts at 1)."
            exit 1
          fi

      - name: Verify tag targets the pinned Redmine version
        run: |
          TAG_TARGET=${GITHUB_REF_NAME%-r*}
          PINNED=$(grep -oE 'redmine:[0-9][0-9.]*' test/redmine/docker-compose.yaml | head -1 | cut -d: -f2)
          if [ "$TAG_TARGET" != "$PINNED" ]; then
            echo "::error::Tag targets Redmine $TAG_TARGET but docker-compose pins redmine:$PINNED."
            exit 1
          fi

      - name: Verify bundle freshness
        run: |
          npx @redocly/cli@latest bundle --config redocly/redocly.yaml dist -o /tmp/fresh.yaml
          if ! diff -u openapi.yaml /tmp/fresh.yaml; then
            echo "::error::Committed openapi.yaml does not match a fresh bundle of src/. Tag a commit where the bundle is up to date."
            exit 1
          fi

      - name: Verify tag matches info.version
        run: |
          VERSION=$(grep -m1 -E '^  version:' openapi.yaml | awk '{print $2}')
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) does not match info.version ($VERSION) in openapi.yaml."
            exit 1
          fi

      - name: Find previous release tag
        id: prev
        run: |
          # Ancestors only, so a maintenance-branch release is compared against
          # its own line, never against a newer main-line release. The second
          # pattern matches the retired format (transition period).
          PREV_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*-r[0-9]*' --match '*+redmine*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREV_TAG:-<none>}"

      - name: Enforce revision ordering
        if: steps.prev.outputs.tag != ''
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          case "$PREV_TAG" in
            *+redmine*)
              echo "Previous tag ($PREV_TAG) uses the retired format; skipping the ordering check."
              exit 0
              ;;
          esac
          PREV_TARGET=${PREV_TAG%-r*}
          PREV_N=${PREV_TAG##*-r}
          NEW_TARGET=${GITHUB_REF_NAME%-r*}
          NEW_N=${GITHUB_REF_NAME##*-r}
          if [ "$NEW_TARGET" = "$PREV_TARGET" ]; then
            if [ "$NEW_N" -ne $((PREV_N + 1)) ]; then
              echo "::error::Same Redmine target as $PREV_TAG; the next revision must be r$((PREV_N + 1)), got r$NEW_N."
              exit 1
            fi
          else
            NEWER=$(printf '%s\n%s\n' "$PREV_TARGET" "$NEW_TARGET" | sort -V | tail -1)
            if [ "$NEWER" != "$NEW_TARGET" ]; then
              echo "::error::Tag targets Redmine $NEW_TARGET, which is older than the previous release's target $PREV_TARGET."
              exit 1
            fi
            if [ "$NEW_N" -ne 1 ]; then
              echo "::error::First release for Redmine $NEW_TARGET must be ${NEW_TARGET}-r1, got r$NEW_N."
              exit 1
            fi
          fi

      - name: Detect breaking changes
        id: breaking
        if: steps.prev.outputs.tag != ''
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          git show "$PREV_TAG:openapi.yaml" > /tmp/previous.yaml
          set +e
          docker run --rm -v /tmp:/tmp -v "$PWD":/repo -w /repo tufin/oasdiff breaking --fail-on ERR /tmp/previous.yaml /repo/openapi.yaml
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          elif [ "$RC" -eq 1 ]; then
            # oasdiff exits 1 when breaking changes are found; the revision
            # number carries no compatibility signal, so the warning goes into
            # the release notes instead of failing the release
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::oasdiff failed with exit code $RC (tool error, not a breaking-change verdict)."
            exit 1
          fi

      - name: Build release notes
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          BREAKING: ${{ steps.breaking.outputs.breaking }}
        run: |
          {
            echo "Tested against: Redmine ${GITHUB_REF_NAME%-r*}"
            echo
            if [ "$BREAKING" = "true" ]; then
              echo "**⚠️ Breaking for consumers of $PREV_TAG: regenerated clients or validators may break. Breaking entries (\`error\` in the changelog below) are often corrections of the spec, not behavior changes in Redmine itself.**"
              echo
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG"
              echo
              echo "Generated by [oasdiff](https://github.com/oasdiff/oasdiff): \`error\` = breaking for spec consumers (regenerated clients or validators may break), \`warning\`/\`info\` = non-breaking."
              echo
              echo '```'
              docker run --rm -v /tmp:/tmp -v "$PWD":/repo -w /repo tufin/oasdiff changelog /tmp/previous.yaml /repo/openapi.yaml || true
              echo '```'
            fi
          } > /tmp/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a release on main may take "latest" (the /releases/latest
          # download URL); a maintenance-line release must never steal it
          if git merge-base --is-ancestor HEAD origin/main; then
            LATEST=--latest
          else
            LATEST=--latest=false
          fi
          gh release create "$GITHUB_REF_NAME" openapi.yaml \
            --verify-tag "$LATEST" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md

  docs-build:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.guard.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip maintenance-line releases
        id: guard
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag is not on main; skipping docs deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.deploy == 'true'
        with:
          node-version: 24
      - uses: actions/configure-pages@v6
        if: steps.guard.outputs.deploy == 'true'
        id: setup
      - name: build docs
        if: steps.guard.outputs.deploy == 'true'
        run: |
          mkdir dist
          cp -r redocly/assets/* dist
          npx @redocly/cli@latest build-docs --config redocly/redocly.yaml dist -t redocly/build-docs-template.hbs --templateOptions.basePath "${{ steps.setup.outputs.base_path }}" -o dist/index.html
          cat > dist/sitemap.xml <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>${{ steps.setup.outputs.base_url }}/</loc>
              <lastmod>$(date +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>
            </url>
          </urlset>
          EOT
      - uses: actions/upload-pages-artifact@v5
        if: steps.guard.outputs.deploy == 'true'
        with:
          path: "dist"

  docs-deploy:
    runs-on: ubuntu-latest
    needs: docs-build
    if: needs.docs-build.outputs.deploy == 'true'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
