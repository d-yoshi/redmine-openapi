          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      security:
        - Basic: []
        - ApiKey: []
        - ApiKeyInQuery: []
        - OAuth2: []
