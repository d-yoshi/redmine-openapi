          type: string
        description:
          type: string
          nullable: true
        customized_type:
          type: string
          enum:
            - issue
            - time_entry
            - project
            - version
            - document
            - user
            - group
            - time_entry_activity
            - issue_priority
            - document_category
        field_format:
          type: string
          enum:
            - enumeration
            - string
            - version
            - attachment
            - user
            - list
            - link
            - float
            - int
            - date
            - bool
            - text
            - progressbar
        regexp:
          type: string
        min_length:
          type: integer
          nullable: true
        max_length:
          type: integer
          nullable: true
        is_required:
          type: boolean
        is_for_all:
          type: boolean
        is_filter:
          type: boolean
        searchable:
          type: boolean
        multiple:
          type: boolean
        default_value:
          type: string
          nullable: true
        default_value_mode:
          type: string
          enum:
            - fixed_date
            - date_offset
          description: Only returned for date custom fields. When date_offset, default_value holds the offset in days from the current date.
        visible:
          type: boolean
        editable:
          type: boolean
        projects:
          type: array
          items:
            $ref: '#/components/schemas/id_name'
          description: Returned for issue custom fields.
        trackers:
          type: array
          items:
            $ref: '#/components/schemas/id_name'
          description: Returned for issue custom fields.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/id_name'
          description: Returned for issue, time-entry, project and version custom fields.
        possible_values:
          type: array
          items:
            type: object
            required:
              - value
              - label
            properties:
              value:
                type: string
              label:
                type: string
          description: Returned when the field format exposes a nonempty list of possible values.
