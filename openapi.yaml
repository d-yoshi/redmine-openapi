  /search.{format}:
    get:
      tags:
        - Search
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Search#GET
      summary: Search
      operationId: getSearch
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/nometa'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - $ref: '#/components/parameters/x_redmine_nometa'
        - name: q
          in: query
          description: 'Search query split into at most five unique tokens; quoted phrases form one token. Non-Han tokens need at least two characters, while a Han character can be a token. An omitted query or a query with no usable tokens returns an empty result and `total_count: null`. By default all tokens must match; `all_words` can select any-token matching.'
          schema:
            type: string
        - name: scope
          in: query
          description: |-
            Search scope.
            Values: `all` (all projects), `my_projects` (projects where current user is a member), `bookmarks` (bookmarked projects), `subprojects` (include subprojects, only effective for project-scoped search)
          schema:
            type: string
            enum:
              - all
              - my_projects
              - bookmarks
              - subprojects
        - name: all_words
          in: query
          description: |-
            Require all words to match. Default is `true` (all words must match).
            Set to empty string to disable (any word matches). Any non-empty value enables this option.
          schema:
            type: string
        - name: titles_only
          in: query
          description: |-
            Search titles only. Default is `false`.
            Any non-empty value enables this option.
          schema:
            type: string
        - name: issues
          in: query
          description: |-
            Include issues in search results. Any non-empty value enables this search type.
            If no search type parameters are specified, all types are searched.
          schema:
            type: integer
            enum:
              - 1
        - name: news
          in: query
          description: |-
            Include news in search results. Any non-empty value enables this search type.
            If no search type parameters are specified, all types are searched.
          schema:
            type: integer
            enum:
              - 1
        - name: wiki_pages
          in: query
          description: |-
            Include wiki pages in search results. Any non-empty value enables this search type.
            If no search type parameters are specified, all types are searched.
          schema:
            type: integer
            enum:
              - 1
        - name: projects
          in: query
          description: Include matching projects when the effective scope covers multiple projects or is global. Any non-empty value enables the type. If no search types are specified, all available types are searched.
          schema:
            type: integer
            enum:
              - 1
        - name: documents
          in: query
          description: |-
            Include documents in search results. Any non-empty value enables this search type.
            If no search type parameters are specified, all types are searched.
          schema:
            type: integer
            enum:
              - 1
        - name: changesets
          in: query
          description: |-
            Include changesets in search results. Any non-empty value enables this search type.
            If no search type parameters are specified, all types are searched.
          schema:
            type: integer
            enum:
              - 1
        - name: messages
          in: query
          description: |-
            Include forum messages in search results. Any non-empty value enables this search type.
            If no search type parameters are specified, all types are searched.
          schema:
            type: integer
            enum:
              - 1
        - name: open_issues
          in: query
          description: |-
            Only return open issues. Default is `false`.
            Any non-empty value enables this option.
          schema:
            type: string
        - name: attachments
          in: query
          description: Search attachment filenames and descriptions belonging to searchable records; file contents are not searched. `0` (default) searches normal record fields, `1` searches normal fields and attachment metadata, and `only` searches attachment metadata only. With `titles_only`, attachment metadata is searched only in `only` mode.
          schema:
            type: string
            enum:
              - '0'
              - '1'
              - only
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/search'
                  total_count:
                    type: integer
                    nullable: true
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
