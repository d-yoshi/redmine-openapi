        - OAuth2: []
  /uploads.{format}:
    post:
      tags:
        - Attachments
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_api#Attaching-files
      summary: Upload attachment file
      operationId: uploadAttachmentFile
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - name: filename
          in: query
          description: Filename for the uploaded file. If not provided, a random hexadecimal name is generated.
          schema:
            type: string
        - name: content_type
          in: query
          description: MIME type of the file (e.g., `application/pdf`, `image/png`). If not provided, auto-detected from the filename.
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - upload
                properties:
                  upload:
                    type: object
                    required:
                      - id
                      - token
                    properties:
                      id:
                        type: integer
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          description: ''
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
  /projects/{project_id}/repository/{repository_id}/revisions/{revision}/issues.{format}:
    post:
      tags:
        - Repositories
      summary: Add related issue
      description: 'Undocumented: This operation is not listed in the official documentation.'
      operationId: addRelatedIssue
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/repository_id'
        - $ref: '#/components/parameters/revision'
        - $ref: '#/components/parameters/x_redmine_switch_user'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - issue_id
              properties:
                issue_id:
                  type: integer
      responses:
        '204':
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: ''
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
  /projects/{project_id}/repository/{repository_id}/revisions/{revision}/issues/{issue_id}.{format}:
    delete:
      tags:
        - Repositories
      summary: Remove related issue
      description: 'Undocumented: This operation is not listed in the official documentation.'
      operationId: removeRelatedIssue
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/repository_id'
        - $ref: '#/components/parameters/revision'
        - $ref: '#/components/parameters/issue_id'
        - $ref: '#/components/parameters/x_redmine_switch_user'
      responses:
        '204':
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: ''
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /projects/{project_id}/wiki.{format}:
    get:
      tags:
        - Wiki Pages
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_WikiPages#Getting-a-wiki-page
      summary: Show wiki start page
      operationId: getWikiStartPage
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - name: include
          in: query
          description: |-
            Comma-separated list of associated data to include in the response.
            Values: `attachments` (file attachments)
          schema:
            type: array
            items:
              type: string
              enum:
                - attachments
          explode: false
        - name: version
          in: query
          description: Historical content version; an alternative to the versioned page path.
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - wiki_page
                properties:
                  wiki_page:
                    $ref: '#/components/schemas/wiki_page'
        '302':
          $ref: '#/components/responses/WikiRedirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: ''
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      description: Returns the configured start page of the project wiki.
  /watchers.{format}:
    post:
      tags:
        - Watchers
      summary: Add watchers to resources
      operationId: addWatchers
      description: Adds users to one or more resources. Requires the permission to add watchers for each resource type and access to the selected projects. Unknown user IDs are ignored.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/x_redmine_switch_user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - object_type
                - object_id
              properties:
                object_type:
                  type: string
                  enum:
                    - issue
                    - wiki_page
                    - message
                  description: Watchable resource type. Wiki-page and forum-message IDs are returned by search results for those types.
                object_id:
                  oneOf:
                    - type: integer
                    - type: array
                      items:
                        type: integer
                      minItems: 1
                watcher:
                  type: object
                  properties:
                    user_id:
                      type: integer
                    user_ids:
                      type: array
                      items:
                        type: integer
                  description: Provide `user_id` for one user or `user_ids` for several users.
                user_id:
                  type: integer
                  description: Alternative to `watcher.user_id` when `watcher` is omitted.
      responses:
        '204':
          description: The request was processed; only eligible users were added.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
        - Watchers
      summary: Remove a watcher from resources
      operationId: removeWatcherFromResources
      description: Removes one user from the selected resources. Requires the permission to delete watchers for each resource type and access to the selected projects.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - name: object_type
          in: query
          description: Watchable resource type. Wiki-page and forum-message IDs are returned by search results for those types.
          schema:
            type: string
            enum:
              - issue
              - wiki_page
              - message
          required: true
        - name: object_id[]
          in: query
          description: Resource IDs from which to remove the watcher.
          schema:
            type: array
            items:
              type: integer
            minItems: 1
          required: true
          style: form
          explode: true
        - name: user_id
          in: query
          description: User ID to remove.
          schema:
            type: integer
          required: true
      responses:
        '204':
          description: The watcher was removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user was not found.
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /time_entries/destroy.{format}:
    delete:
      tags:
        - Time Entries
      summary: Delete time entries
      operationId: deleteTimeEntries
      description: Deletes several time entries. The current user must be allowed to delete every selected entry.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - name: ids[]
          in: query
          description: IDs of the records to delete.
          schema:
            type: array
            items:
              type: integer
            minItems: 1
          required: true
          style: form
          explode: true
      responses:
        '204':
          description: The entries were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: One or more entries were not found.
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: The entries could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
  /attachments/download/{attachment_id}.{format}:
    get:
      tags:
        - Attachments
      summary: Download attachment by ID
      description: Downloads an attachment without including its filename in the path. The JSON format selects empty API error responses; successful responses contain the original file bytes.
      operationId: downloadAttachmentById
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/attachment_id'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - name: If-None-Match
          in: header
          description: ETag from a previous response. A matching tag returns 304 without a body.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: string
                format: binary
          headers:
            ETag:
              description: Cache validator for this attachment or thumbnail.
              schema:
                type: string
        '304':
          description: The ETag matches; no response body is sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The attachment was not found.
        '412':
          $ref: '#/components/responses/PreconditionFailed'
components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: Username and password, or an API key as the username with any password. API authentication must be enabled.
    ApiKey:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
      description: Personal REST API key. API authentication must be enabled.
    ApiKeyInQuery:
      type: apiKey
      in: query
      name: key
      description: Personal REST API key sent in the query string. API authentication must be enabled.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes: {}
      description: Authorization-code OAuth token with scopes permitting the requested action. PUT /my/account.json is not available through OAuth.
  responses:
    NoContent:
      description: The request was completed successfully; no response body is returned.
    ResourceNotFound:
      description: The requested resource was not found or is not visible.
    ValidationErrors:
      description: The request could not be completed. The response lists the reasons.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
    WikiRedirect:
      description: The requested Wiki title redirects to the page at its current title. This occurs when a redirect remains after a rename or move, including when the configured start-page title refers to a redirect.
      headers:
        Location:
          description: Target page URL. The URL may omit the `.json` suffix; the response format at that URL can depend on the client's Accept header.
          schema:
            type: string
    WikiPageCreated:
      description: The Wiki page was created.
      content:
        application/json:
          schema:
            type: object
            required:
              - wiki_page
            properties:
              wiki_page:
                $ref: '#/components/schemas/wiki_page'
    WikiContentConflict:
      description: The supplied content version conflicts with the current Wiki content version.
    Unauthorized:
      description: Authentication is required by the operation, installation settings or resource permissions. Invalid credentials also return 401. API-key and Basic authentication return 403 when REST API authentication is disabled.
    Forbidden:
      description: The current user, including an anonymous user, lacks permission for the action or resource.
    PreconditionFailed:
      description: Invalid X-Redmine-Switch-User header. Returns 412 when the specified user does not exist or is not active. Only applicable to admin users using the X-Redmine-Switch-User header.
  requestBodies:
    UpdateJournal:
      $ref: '#/components/requestBodies/update_journal'
    UpdateUser:
      $ref: '#/components/requestBodies/update_user'
    UpdateMembership:
      $ref: '#/components/requestBodies/update_membership'
    UpdateIssueCategory:
      $ref: '#/components/requestBodies/update_issue_category'
    UpdateWikiPage:
      $ref: '#/components/requestBodies/update_wiki_page'
    UpdateProject:
      $ref: '#/components/requestBodies/update_project'
    UpdateIssue:
      $ref: '#/components/requestBodies/update_issue'
    UpdateNews:
      $ref: '#/components/requestBodies/update_news'
    UpdateVersion:
      $ref: '#/components/requestBodies/update_version'
    UpdateTimeEntry:
      $ref: '#/components/requestBodies/update_time_entry'
    UpdateGroup:
      $ref: '#/components/requestBodies/update_group'
    UpdateAttachment:
      $ref: '#/components/requestBodies/update_attachment'
    update_issue:
      content:
        application/json:
          schema:
            type: object
            properties:
              issue:
                type: object
                properties:
                  project_id:
                    oneOf:
                      - type: integer
                      - type: string
                  tracker_id:
                    type: integer
                  status_id:
                    type: integer
                  priority_id:
                    type: integer
                  subject:
                    type: string
                  description:
                    type: string
                    nullable: true
                  start_date:
                    type: string
                    format: date
                    nullable: true
                  due_date:
                    type: string
                    format: date
                    nullable: true
                  done_ratio:
                    type: integer
                    minimum: 0
                    maximum: 100
                  category_id:
                    type: integer
                    nullable: true
                  fixed_version_id:
                    type: integer
                    nullable: true
                  assigned_to_id:
                    description: Assignee ID. The value `me` selects the current user.
                    oneOf:
                      - type: integer
                        nullable: true
                      - type: string
                        enum:
                          - me
                  parent_issue_id:
                    type: integer
                    nullable: true
                  custom_fields:
                    $ref: '#/components/schemas/custom_fields'
                  custom_field_values:
                    $ref: '#/components/schemas/custom_field_values'
                  is_private:
                    type: boolean
                  estimated_hours:
                    description: Duration as decimal hours or a string such as `1:30`, `1h30` or `90m`. Responses return numeric hours.
                    oneOf:
                      - type: number
                        nullable: true
                      - type: string
                  notes:
                    type: string
                  private_notes:
                    description: Mark the notes as private. Visible to their author and users with the View private notes permission.
                    type: boolean
                  deleted_attachment_ids:
                    description: IDs of existing attachments to remove from this issue.
                    type: array
                    items:
                      type: integer
                  uploads:
                    $ref: '#/components/schemas/uploads'
    update_project:
      content:
        application/json:
          schema:
            type: object
            properties:
              project:
                type: object
                properties:
                  identifier:
                    type: string
                    description: |
                      Accepted but ignored: a project's identifier cannot be changed
                      once the project exists, and the request still succeeds.
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  homepage:
                    type: string
                    nullable: true
                  is_public:
                    type: boolean
                  parent_id:
                    type: integer
                    nullable: true
                  inherit_members:
                    description: Inherit members from the parent project. Only effective for subprojects (parent_id is set).
                    type: boolean
                  default_assigned_to_id:
                    description: Default assignee for new issues in this project. Set to null to clear.
                    type: integer
                    nullable: true
                  default_version_id:
                    description: Default target version for new issues in this project. Set to null to clear.
                    type: integer
                    nullable: true
                  default_issue_query_id:
                    description: Default saved query for the project's issue list page. Set to null to clear.
                    type: integer
                    nullable: true
                  tracker_ids:
                    description: IDs of trackers available in this project.
                    type: array
                    items:
                      type: integer
                  enabled_module_names:
                    description: |-
                      Enabled module names for this project.
                      Values: `issue_tracking`, `time_tracking`, `news`, `documents`, `files`, `wiki`, `repository`, `boards`, `calendar`, `gantt`
                    type: array
                    items:
                      type: string
                  issue_custom_field_ids:
                    description: IDs of issue custom fields enabled for this project. Custom fields with `is_for_all=true` are always available regardless of this setting.
                    type: array
                    items:
                      type: integer
                  custom_fields:
                    $ref: '#/components/schemas/custom_fields'
                  custom_field_values:
                    $ref: '#/components/schemas/custom_field_values'
    update_membership:
      content:
        application/json:
          schema:
            type: object
            properties:
              membership:
                type: object
                required:
                  - role_ids
                properties:
                  role_ids:
                    type: array
                    items:
                      type: integer
                    description: Replaces the roles that the current user can manage. Inherited roles are preserved. If the update leaves no roles, the membership is removed and the response is 422.
    update_user:
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  login:
                    type: string
                  admin:
                    type: boolean
                  password:
                    type: string
                  firstname:
                    type: string
                  lastname:
                    type: string
                  mail:
                    type: string
                  language:
                    type: string
                  auth_source_id:
                    description: External authentication source ID (e.g., LDAP). When set, the user authenticates via the external source and the password field is ignored. Set to null for local authentication.
                    type: integer
                    nullable: true
                  mail_notification:
                    description: |-
                      Email notification preference.
                      Values: `all` (for any event on all projects), `selected` (for any event on selected projects only), `only_my_events` (only for things the user watches or is involved in), `only_assigned` (only for things assigned to the user), `only_owner` (only for things owned by the user), `only_my_watches` (only for issues the user watches), `none` (no events)
                    type: string
                    enum:
                      - all
                      - selected
                      - only_my_events
                      - only_assigned
                      - only_owner
                      - only_my_watches
                      - none
                  notified_project_ids:
                    description: Project IDs for which to receive email notifications. Only effective when mail_notification is set to `selected`.
                    type: array
                    items:
                      type: integer
                  must_change_passwd:
                    description: Force the user to change their password at next login.
                    type: boolean
                  generate_password:
                    description: Generate a random password automatically. When true, the password field is ignored. Only effective for locally authenticated users (auth_source_id is null).
                    type: boolean
                  status:
                    description: 'User account status: `1` (active), `2` (registered), `3` (locked).'
                    type: integer
                  custom_fields:
                    $ref: '#/components/schemas/custom_fields'
                  custom_field_values:
                    $ref: '#/components/schemas/custom_field_values'
                  group_ids:
                    description: Group IDs to assign the user to. Admin-only. Replaces all current group memberships (not append).
                    type: array
                    items:
                      type: integer
              send_information:
                description: Request an account-information email for an active user other than the current user. Account activation can separately trigger a notification. This option is not stored.
                type: boolean
              pref:
                $ref: '#/components/schemas/pref'
    update_time_entry:
      content:
        application/json:
          schema:
            type: object
            properties:
              time_entry:
                type: object
                properties:
                  issue_id:
                    type: integer
                    nullable: true
                    description: Set to null to detach the entry from its issue, if the installation does not require an issue for time entries.
                  project_id:
                    type: integer
                  spent_on:
                    type: string
                    format: date
                  hours:
                    description: Duration as decimal hours or a string such as `1:30`, `1h30` or `90m`. Responses return numeric hours.
                    oneOf:
                      - type: number
                      - type: string
                  activity_id:
                    type: integer
                  comments:
                    type: string
                    nullable: true
                  user_id:
                    type: integer
                  custom_fields:
                    $ref: '#/components/schemas/custom_fields'
                  custom_field_values:
                    $ref: '#/components/schemas/custom_field_values'
    update_news:
      content:
        application/json:
          schema:
            type: object
            properties:
              news:
                type: object
                properties:
                  title:
                    type: string
                  summary:
                    type: string
                    nullable: true
                  description:
                    type: string
                  uploads:
                    $ref: '#/components/schemas/uploads'
    update_version:
      content:
        application/json:
          schema:
            type: object
            properties:
              version:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - open
                      - locked
                      - closed
                  sharing:
                    description: |-
                      Version sharing scope.
                      Values: `none` (not shared), `descendants` (with subprojects), `hierarchy` (with ancestors and descendants), `tree` (with entire project tree), `system` (with all projects)
                      `system` requires an administrator. `hierarchy` and `tree` require permission to manage versions in the root project.
                    type: string
                    enum:
                      - none
                      - descendants
                      - hierarchy
                      - tree
                      - system
                  due_date:
                    type: string
                    format: date
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  wiki_page_title:
                    description: Title of a wiki page to associate with this version. Set to null to clear.
                    type: string
                    nullable: true
                  default_project_version:
                    description: Set to true to make this the default target version for new issues in the project.
                    type: boolean
                  custom_fields:
                    $ref: '#/components/schemas/custom_fields'
                  custom_field_values:
                    $ref: '#/components/schemas/custom_field_values'
    update_wiki_page:
      content:
        application/json:
          schema:
            type: object
            properties:
              wiki_page:
                type: object
                required:
                  - text
                properties:
                  text:
                    type: string
                  comments:
                    type: string
                  version:
                    description: Content version for optimistic locking. When text changes, a version that differs from the current content version causes 409 Conflict. Unchanged text does not trigger this conflict.
                    type: integer
                  parent_title:
                    description: Title of the parent wiki page. Sets this page as a child in the page hierarchy.
                    type: string
                  title:
                    description: New title for the page (rename). Requires the rename_wiki_pages permission.
                    type: string
                  redirect_existing_links:
                    description: When renaming with title, controls whether the old title keeps redirecting to the new one. Only the string "0" disables the redirect; any other value (including boolean false) leaves it enabled.
                    type: string
                    enum:
                      - '0'
                      - '1'
                  is_start_page:
                    description: Set to true to make this page the wiki start page. When renaming the current start page, omission updates the configured title automatically; false keeps the previous configured title. Setting this parameter requires the manage_wiki permission.
                    type: boolean
                  deleted_attachment_ids:
                    type: array
                    items:
                      type: integer
                  uploads:
                    $ref: '#/components/schemas/uploads'
    update_attachment:
      content:
        application/json:
          schema:
            type: object
            properties:
              attachment:
                type: object
                properties:
                  filename:
                    type: string
                  content_type:
                    type: string
                  description:
                    type: string
    update_issue_category:
      content:
        application/json:
          schema:
            type: object
            properties:
              issue_category:
                type: object
                properties:
                  name:
                    type: string
                  assigned_to_id:
                    type: integer
    update_group:
      content:
        application/json:
          schema:
            type: object
            properties:
              group:
                type: object
                properties:
                  name:
                    type: string
                  user_ids:
                    type: array
                    items:
                      type: integer
                  twofa_required:
                    type: boolean
                  custom_fields:
                    $ref: '#/components/schemas/custom_fields'
                  custom_field_values:
                    $ref: '#/components/schemas/custom_field_values'
    update_journal:
      content:
        application/json:
          schema:
            type: object
            properties:
              journal:
                type: object
                properties:
                  notes:
                    type: string
                    nullable: true
                    description: A journal left with empty `notes` and no property changes (`details`) is kept and can still be updated, but is omitted from the issue's `include=journals` response until it has notes again.
                  private_notes:
                    description: Mark the notes as private. Visible to their author and users with the View private notes permission.
                    type: boolean
  parameters:
    format:
      name: format
      in: path
      required: true
      schema:
        type: string
        enum:
          - json
    offset:
      name: offset
      in: query
      schema:
        type: integer
      description: Number of records to skip. Negative values are treated as 0. Takes precedence over `page`; if neither is supplied, the first page is returned.
    limit:
      name: limit
      in: query
      schema:
        type: integer
      description: Maximum records per page. Defaults to 25 when omitted or less than 1; values above 100 are capped at 100.
    nometa:
      name: nometa
      in: query
      schema:
        type: integer
        enum:
          - 1
      description: Send `1` to omit `total_count`, `offset` and `limit` from the response. The X-Redmine-Nometa header is an alternative.
    x_redmine_switch_user:
      name: X-Redmine-Switch-User
      in: header
      schema:
        type: string
        example: jsmith
    x_redmine_nometa:
      name: X-Redmine-Nometa
      in: header
      schema:
        type: integer
        enum:
          - 1
    custom_filters:
      name: cf_x
      in: query
      description: |-
        Custom-field filters, using actual field names as keys.
        Use `cf_12` for custom field 12 on the listed records. Issue lists also support `project.cf_12`, `author.cf_12`, `assigned_to.cf_12` and `fixed_version.cf_12`; time-entry lists support `project.cf_12`, `user.cf_12` and `issue.cf_12`.
        Reference fields can expose chained names such as `cf_12.cf_34`, or version attributes `cf_12.due_date` and `cf_12.status`. Only registered, visible fields enabled as filters are available. Operators and values depend on the field type. Use explicit `f[]`, `op` and `v` for repeated values without shortcut parsing.
      schema:
        type: object
        additionalProperties:
          type: string
      style: form
      explode: true
    page:
      name: page
      in: query
      description: Page number, starting at 1. Used only when `offset` is absent; the offset is `(page - 1) * limit`, with negative results treated as 0.
      schema:
        type: integer
    filter_fields:
      name: f[]
      in: query
      description: Explicit filter field names. Without `query_id`, these replace the default filters. Pair each field with `op[field]` and, where needed, repeated `v[field][]` values. Available fields depend on permissions, project context and enabled custom fields.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    filter_operators:
      name: op
      in: query
      description: Operator for each field in `f[]`, encoded as `op[status_id]=o`, for example. Uses the same operators as the corresponding shortcut filter.
      schema:
        type: object
        additionalProperties:
          type: string
      style: deepObject
      explode: true
    filter_values:
      name: v
      in: query
      description: |-
        Values for each field in `f[]`. Encode each value as `v[field][]=value`; for example, send `op[project_id]=%3D&v[project_id][]=1&v[project_id][]=2` to select projects 1 and 2 with equality.
        OpenAPI 3.0 does not standardize nested array serialization in deep objects; configure the client serializer to send these repeated bracketed keys.
      schema:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      style: deepObject
      explode: true
    issue_delete_todo:
      name: todo
      in: query
      description: 'How to handle time entries on the deleted issues: `destroy` (default) deletes them, `nullify` keeps them without an issue when the time-tracking settings allow it, and `reassign` moves them to `reassign_to_id`. Used when the selected issues have positive total spent time.'
      schema:
        type: string
        enum:
          - destroy
          - nullify
          - reassign
    issue_delete_reassign_to_id:
      name: reassign_to_id
      in: query
      description: Destination issue ID for `todo=reassign`. The issue must be outside the deleted set and belong to the same project as the moved entries.
      schema:
        type: integer
