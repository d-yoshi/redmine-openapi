openapi: 3.0.3
info:
  title: Redmine API
  description: |-
    Unofficial OpenAPI specification for Redmine 7.0.3. This specification covers JSON REST representations and related attachment downloads. XML responses are outside its scope.

    When JSONP support is enabled, Redmine can return JavaScript responses selected with the `callback` or `jsonp` query parameter. This specification excludes JSONP responses and does not define those parameters.

    Authentication is optional where installation settings, project visibility and permissions allow anonymous access. Operations that require an account or administrator credentials declare that requirement explicitly.
  contact:
    name: d-yoshi/redmine-openapi
    url: https://github.com/d-yoshi/redmine-openapi
  license:
    name: MIT
    url: https://github.com/d-yoshi/redmine-openapi/blob/main/LICENSE
  version: 7.0.3-r2
servers:
  - url: /
security:
  - Basic: []
  - ApiKey: []
  - ApiKeyInQuery: []
  - OAuth2: []
  - {}
tags:
  - name: Issues
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues
  - name: Projects
    externalDocs:
