  - name: Issue Categories
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_IssueCategories
  - name: Roles
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_Roles
  - name: Groups
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_Groups
  - name: Custom Fields
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_CustomFields
  - name: Search
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_Search
  - name: Files
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_Files
  - name: My Account
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_MyAccount
  - name: Journals
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_Journals
  - name: Repositories
  - name: Watchers
externalDocs:
  description: Redmine API Official Developer Guide
  url: https://www.redmine.org/projects/redmine/wiki/Rest_api
paths:
  /issues.{format}:
    get:
      tags:
        - Issues
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Listing-issues
      summary: List issues
      operationId: getIssues
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/nometa'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - $ref: '#/components/parameters/x_redmine_nometa'
        - name: sort
          in: query
          description: 'Sort order: up to three comma-separated criteria of `field`, `field:asc` or `field:desc`. The default direction is ascending. Examples: `id:desc`, `status:desc,id`.'
          schema:
            type: string
            example: id:desc
        - name: include
          in: query
          description: |-
            Comma-separated list of associated data to include for each issue.
            Values: `attachments` (file attachments), `relations` (issue relations)
          schema:
            type: array
            items:
              type: string
              enum:
                - attachments
                - relations
          explode: false
        - name: issue_id
          in: query
          description: |-
            Filter by issue ID.
            Format: `[operator]value`
            Operators: `=` (default), `>=`, `<=`, `><` (between, pipe-separated), `*` (any), `!*` (none)
            For equality, separate multiple IDs with commas. A pipe separates range bounds, not IDs in an equality list.
            Examples: `1`, `1,2`, `>=100`, `><1|100`
          schema:
            type: string
        - name: project_id
          in: query
          description: Project ID or identifier selecting the project context. Query operators and multiple IDs are not accepted here. Subprojects are included according to the installation setting unless `subproject_id` overrides it. Use explicit `f[]`, `op` and `v` filters to select multiple projects without this shortcut.
          schema:
            type: string
        - name: subproject_id
          in: query
          description: |-
            Filter by subproject.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none)
            Examples: `1|2`, `*`, `!*`
            Available only for a project with subprojects.
          schema:
            type: string
        - name: tracker_id
          in: query
          description: |-
            Filter by tracker.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `ev` (has ever been), `!ev` (has never been), `cf` (changed from)
            Examples: `1|2`, `!3`
          schema:
            type: string
        - name: status_id
          in: query
          description: |-
            Filter by issue status.
            Format: `[operator]value[|value2|...]`
            Operators: `o` (open), `=` (default), `!` (not equal), `c` (closed), `*` (any), `ev` (has ever been), `!ev` (has never been), `cf` (changed from)
            Examples: `o`, `1|2`, `c`, `!3`
          schema:
            type: string
        - name: priority_id
          in: query
          description: |-
            Filter by priority.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `ev` (has ever been), `!ev` (has never been), `cf` (changed from)
            Examples: `1|2`, `!3`
          schema:
            type: string
        - name: assigned_to_id
          in: query
          description: |-
            Filter by assignee.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none), `ev` (has ever been), `!ev` (has never been), `cf` (changed from)
            Special values: `me` (current user and their groups)
            Examples: `1`, `me`, `!*`, `!me`
          schema:
            type: string
        - name: author_id
          in: query
          description: |-
            Filter by author.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Special values: `me` (current user)
            Examples: `1`, `me`, `!me`
          schema:
            type: string
        - name: author.group
          in: query
          description: |-
            Filter by author's group.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Examples: `1|2`
          schema:
            type: string
        - name: author.role
          in: query
          description: |-
            Filter by author's role.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Examples: `1|2`
          schema:
            type: string
        - name: member_of_group
          in: query
          description: |-
            Filter by assignee's group membership.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none)
            Examples: `1`, `*`
          schema:
            type: string
        - name: assigned_to_role
          in: query
          description: |-
            Filter by assignee's role.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none)
            Examples: `1`, `*`
          schema:
            type: string
        - name: fixed_version_id
          in: query
          description: |-
            Filter by target version.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none), `ev` (has ever been), `!ev` (has never been), `cf` (changed from)
            Examples: `1|2`, `!*`
          schema:
            type: string
        - name: fixed_version.due_date
          in: query
          description: |-
            Filter by target version's due date.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `nd` (tomorrow), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `nw` (next week), `m` (this month), `lm` (last month), `nm` (next month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `t+` (in n days), `>t+` (on or after n days from now), `<t+` (on or before n days from now), `><t+` (from today through n days from now), `*` (any), `!*` (none)
            Examples: `>=2024-01-01`, `t`, `>t-7`
          schema:
            type: string
        - name: fixed_version.status
          in: query
          description: |-
            Filter by target version's status.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Values: `open`, `locked`, `closed`
            Examples: `open`, `open|locked`, `!closed`
          schema:
            type: string
        - name: category_id
          in: query
          description: |-
            Filter by category.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none), `ev` (has ever been), `!ev` (has never been), `cf` (changed from)
            Examples: `1|2`, `!*`
            Available only in a project context.
          schema:
            type: string
        - name: parent_id
          in: query
          description: |-
            Filter by parent issue.
            Format: `[operator]value`
            Operators: `=` (exact parent ID), `~` (descendant of, subtree search), `*` (any, i.e. is a subtask), `!*` (none, i.e. is a root issue)
            Examples: `123`, `~123`, `*`, `!*`
          schema:
            type: string
        - name: child_id
          in: query
          description: |-
            Filter by child issue.
            Format: `[operator]value`
            Operators: `=` (exact child ID), `~` (ancestor of, subtree search), `*` (any, i.e. has subtasks), `!*` (none, i.e. is a leaf issue)
            Examples: `123`, `~123`, `*`, `!*`
          schema:
            type: string
        - $ref: '#/components/parameters/custom_filters'
        - name: subject
          in: query
          description: |-
            Filter by subject.
            Format: `<operator>value`
            Operators: `~` (contains), `!~` (not contains), `*~` (contains any word), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~keyword`, `^prefix`
          schema:
            type: string
        - name: description
          in: query
          description: |-
            Filter by description.
            Format: `<operator>value`
            Operators: `~` (contains), `!~` (not contains), `*~` (contains any word), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~keyword`, `!~excluded`
          schema:
            type: string
        - name: notes
          in: query
          description: |-
            Filter by journal notes.
            Format: `<operator>value`
            Operators: `~` (contains), `!~` (not contains), `*~` (contains any word), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~keyword`
          schema:
            type: string
        - name: created_on
          in: query
          description: |-
            Filter by creation date or timestamp.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `m` (this month), `lm` (last month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `*` (any), `!*` (none)
            Timestamp filters with a lower bound may also return issues from the preceding second.
            Examples: `>=2024-01-01`, `>=2024-01-01T08:00:00Z`, `t`, `>t-7`, `lm`
          schema:
            type: string
        - name: updated_on
          in: query
          description: |-
            Filter by last updated date or timestamp.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `m` (this month), `lm` (last month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `*` (any), `!*` (none)
            Timestamp filters with a lower bound may also return issues from the preceding second.
            Examples: `>=2024-01-01`, `>=2024-01-01T08:00:00Z`, `t`, `>t-7`, `lm`
            For this field, `*` means updated after creation and `!*` means never updated after creation.
          schema:
            type: string
        - name: closed_on
          in: query
          description: |-
            Filter by closed date or timestamp.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `m` (this month), `lm` (last month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `*` (any), `!*` (none)
            Timestamp filters with a lower bound may also return issues from the preceding second.
            Examples: `>=2024-01-01`, `>=2024-01-01T08:00:00Z`, `t`, `>t-7`, `lm`
          schema:
            type: string
        - name: start_date
          in: query
          description: |-
            Filter by start date.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `nd` (tomorrow), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `nw` (next week), `m` (this month), `lm` (last month), `nm` (next month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `t+` (in n days), `>t+` (on or after n days from now), `<t+` (on or before n days from now), `><t+` (from today through n days from now), `*` (any), `!*` (none)
            Examples: `>=2024-01-01`, `t`, `>t-7`
          schema:
            type: string
        - name: due_date
          in: query
          description: |-
            Filter by due date.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `nd` (tomorrow), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `nw` (next week), `m` (this month), `lm` (last month), `nm` (next month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `t+` (in n days), `>t+` (on or after n days from now), `<t+` (on or before n days from now), `><t+` (from today through n days from now), `*` (any), `!*` (none)
            Examples: `>=2024-01-01`, `t`, `>t-7`
          schema:
            type: string
        - name: estimated_hours
          in: query
          description: |-
            Filter by estimated hours.
            Format: `[operator]value`
            Operators: `=` (default), `>=`, `<=`, `><` (between, pipe-separated), `*` (any), `!*` (none)
            Values can be decimal hours (`1.5`), hours and minutes (`1:30` or `1h30`), or minutes (`90m`).
            Examples: `>=5`, `><1:30|2:30`, `!*`
          schema:
            type: string
        - name: spent_time
          in: query
          description: |-
            Filter by total spent time.
            Format: `[operator]value`
            Operators: `=` (default), `>=`, `<=`, `><` (between, pipe-separated), `*` (any), `!*` (none)
            Values can be decimal hours (`1.5`), hours and minutes (`1:30` or `1h30`), or minutes (`90m`).
            Examples: `>=5`, `><1:30|2:30`, `!*`
            Requires permission to view spent time.
          schema:
            type: string
        - name: done_ratio
          in: query
          description: |-
            Filter by done ratio (percentage).
            Format: `[operator]value`
            Operators: `=` (default), `>=`, `<=`, `><` (between, pipe-separated), `*` (any), `!*` (none)
            Examples: `>=50`, `><0|99`, `100`
          schema:
            type: string
        - name: is_private
          in: query
          description: |-
            Filter by private flag.
            Format: `[operator]value`
            Operators: `=` (default), `!` (not equal)
            Values: `1` (private), `0` (not private)
            Examples: `1`, `0`
            Available only when the current user can view private issues.
          schema:
            type: string
        - name: attachment
          in: query
          description: |-
            Filter by attachment filename.
            Format: `<operator>value`
            Operators: `~` (contains), `!~` (not contains), `*~` (contains any word), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~report`, `$.pdf`
          schema:
            type: string
        - name: attachment_description
          in: query
          description: |-
            Filter by attachment description.
            Format: `<operator>value`
            Operators: `~` (contains), `!~` (not contains), `*~` (contains any word), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~screenshot`
          schema:
            type: string
        - name: watcher_id
          in: query
          description: |-
            Filter by watcher.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Special values: `me` (current user and their groups)
            Examples: `1`, `me`, `!me`
            Available only to logged-in users.
          schema:
            type: string
        - name: updated_by
          in: query
          description: |-
            Filter by user who updated the issue.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Special values: `me` (current user)
            Examples: `1`, `me`
          schema:
            type: string
        - name: last_updated_by
          in: query
          description: |-
            Filter by user who last updated the issue.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Special values: `me` (current user)
            Examples: `1`, `me`
          schema:
            type: string
        - name: project.status
          in: query
          description: |-
            Filter by project status.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Values: `1` (active), `5` (closed)
            Examples: `1`, `!5`
          schema:
            type: string
        - name: relates
          in: query
          description: Filter by the relates relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: duplicates
          in: query
          description: Filter by the duplicates relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: duplicated
          in: query
          description: Filter by the duplicated relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: blocks
          in: query
          description: Filter by the blocks relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: blocked
          in: query
          description: Filter by the blocked relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: precedes
          in: query
          description: Filter by the precedes relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: follows
          in: query
          description: Filter by the follows relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: copied_to
          in: query
          description: Filter by the copied_to relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: copied_from
          in: query
          description: Filter by the copied_from relation.
          schema:
            $ref: '#/components/schemas/relation_filter'
        - name: any_searchable
          in: query
          description: |-
            Full-text search across all searchable fields.
            Format: `<operator>value`
            Operators: `~` (contains all words), `*~` (contains any word), `!~` (not contains)
            Examples: `~keyword`, `*~foo bar`
          schema:
            type: string
        - name: query_id
          in: query
          description: |-
            ID of a saved query to apply. When specified, the saved query's filter criteria are used.
            Other filter parameters in the same request are ignored.
            Use GET /queries.json to retrieve available saved queries.
          schema:
            type: integer
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/filter_fields'
        - $ref: '#/components/parameters/filter_operators'
        - $ref: '#/components/parameters/filter_values'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - issues
                properties:
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/issue.summary'
                  total_count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Returned when the query_id parameter refers to a nonexistent query.
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: Returned when a filter parameter has an invalid value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      description: Lists visible issues. Without a saved query or explicit status filter, only open issues are returned. Available filters depend on the project modules, enabled core fields, custom fields and the current user's permissions.
    post:
      tags:
        - Issues
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Creating-an-issue
      summary: Create issue
      operationId: createIssue
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - name: copy_from
          in: query
          description: ID of a visible issue to copy. The current user needs permission to copy issues.
          schema:
            type: integer
        - name: link_copy
          in: query
          description: Link the new issue to its source with a copied relation. Used with `copy_from`.
          schema:
            type: integer
            enum:
              - 1
        - name: copy_attachments
          in: query
          description: Copy attachments from the source issue. Used with `copy_from`.
          schema:
