      summary: Create issue relation
      operationId: createIssueRelation
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/issue_id'
        - $ref: '#/components/parameters/x_redmine_switch_user'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - relation
              properties:
                relation:
                  type: object
                  required:
                    - issue_to_id
                  properties:
                    issue_to_id:
                      description: One target issue ID, comma-separated IDs, or an array of IDs. Redmine creates relations in order and returns the last one. Earlier relations can remain if a later target fails.
                      oneOf:
                        - type: integer
                        - type: string
                        - type: array
                          items:
                            oneOf:
                              - type: integer
                              - type: string
                    relation_type:
                      description: |-
                        Type of relation from this issue to the target issue.
                        Values: `relates` (related to), `duplicates` (this duplicates target), `duplicated` (this is duplicated by target), `blocks` (this blocks target), `blocked` (this is blocked by target), `precedes` (this must finish before target starts), `follows` (this must start after target finishes), `copied_to` (this was copied to target), `copied_from` (this was copied from target)
                      type: string
                      enum:
                        - relates
                        - duplicates
                        - duplicated
                        - blocks
                        - blocked
                        - precedes
                        - follows
                        - copied_to
                        - copied_from
                      default: relates
                    delay:
                      description: Number of days of delay for `precedes`/`follows` relations. Ignored for other relation types.
                      type: integer
                      nullable: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - relation
                properties:
                  relation:
                    $ref: '#/components/schemas/issue_relation'
