  /projects.{format}:
    get:
      tags:
        - Projects
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Projects#Listing-projects
      summary: List projects
      operationId: getProjects
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/nometa'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - $ref: '#/components/parameters/x_redmine_nometa'
        - name: include
          in: query
          description: |-
            Comma-separated list of associated data to include for each project.
            Values: `trackers` (available issue trackers), `issue_categories` (issue categories), `time_entry_activities` (time entry activity types), `enabled_modules` (enabled modules/features), `issue_custom_fields` (custom fields for issues)
          schema:
            type: array
            items:
              type: string
              enum:
                - trackers
                - issue_categories
                - time_entry_activities
                - enabled_modules
                - issue_custom_fields
          explode: false
        - name: status
          in: query
          description: |-
            Filter by project status.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Values: `1` (active), `5` (closed)
            Examples: `1`, `1|5`, `!1`
          schema:
            type: string
        - name: id
          in: query
          description: |-
            Filter by project ID.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal)
            Special values: `mine` (projects where current user is a member), `bookmarks` (bookmarked projects)
            Examples: `1|2|3`, `mine`, `!mine`, `mine|bookmarks`
          schema:
            type: string
        - name: name
          in: query
          description: |-
            Filter by project name.
            Format: `<operator>value`
            Operators: `~` (contains), `!~` (not contains), `*~` (contains any word), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~keyword`, `^prefix`
          schema:
            type: string
        - name: description
          in: query
          description: |-
            Filter by project description.
            Format: `<operator>value`
            Operators: `~` (contains), `!~` (not contains), `*~` (contains any word), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~keyword`, `!~excluded`
          schema:
            type: string
        - name: parent_id
          in: query
          description: |-
            Filter by parent project.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any, i.e. is a subproject), `!*` (none, i.e. is a root project)
            Special values: `mine` (projects where current user is a member), `bookmarks` (bookmarked projects)
            Examples: `1|2`, `mine`, `*`, `!*`
          schema:
            type: string
        - name: is_public
          in: query
          description: |-
            Filter by public/private status.
            Format: `[operator]value`
            Operators: `=` (default), `!` (not equal)
            Values: `1` (public), `0` (private)
            Examples: `1`, `!1`
          schema:
            type: string
        - name: created_on
          in: query
          description: |-
            Filter by creation date.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `m` (this month), `lm` (last month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `*` (any), `!*` (none)
            Examples: `>=2024-01-01`, `><2024-01-01|2024-12-31`, `t`, `>t-7`, `lm`
          schema:
            type: string
        - name: updated_on
          in: query
          description: |-
            Filter by last updated date.
            Format: `<operator>[value]`
            Operators: `=` (on date), `>=` (on or after), `<=` (on or before), `><` (between, pipe-separated), `t` (today), `ld` (yesterday), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `m` (this month), `lm` (last month), `y` (this year), `t-` (n days ago), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `*` (any), `!*` (none)
            Examples: `>=2024-01-01`, `><2024-01-01|2024-12-31`, `t`, `>t-7`, `lm`
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/query_id'
        - $ref: '#/components/parameters/filter_fields'
        - $ref: '#/components/parameters/filter_operators'
        - $ref: '#/components/parameters/filter_values'
        - $ref: '#/components/parameters/custom_filters'
        - name: sort
          in: query
          description: 'Comma-separated list of up to three field names, optionally followed by :asc or :desc. The default direction is ascending. Stock fields: name, status, short_description, homepage, identifier, parent_id, is_public, created_on, updated_on. Sortable custom-field columns use cf_<id>. Example: name:desc.'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - projects
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/project.summary'
                  total_count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The saved query was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/framework_error'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
