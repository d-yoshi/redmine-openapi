  - name: Attachments
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_Attachments
  - name: Issue Statuses
    externalDocs:
      url: https://www.redmine.org/projects/redmine/wiki/Rest_IssueStatuses
  - name: Trackers
    externalDocs:
