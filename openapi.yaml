  /users.{format}:
    get:
      tags:
        - Users
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Users#GET
      summary: List users
      operationId: getUsers
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/nometa'
        - $ref: '#/components/parameters/x_redmine_switch_user'
        - $ref: '#/components/parameters/x_redmine_nometa'
        - name: include
          in: query
          description: |-
            Comma-separated list of associated data to include for each user.
            Values: `auth_source` (authentication source information)
          schema:
            type: array
            items:
              type: string
              enum:
                - auth_source
          explode: false
        - name: status
          in: query
          description: |-
            Filter by user status.
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none)
            Values: `1` (active), `2` (registered), `3` (locked)
            Examples: `1`, `1|2`, `!3`
          schema:
            type: string
        - name: name
          in: query
          description: |-
            Filter by name, login, or email (contains search).
            The API always uses the `~` (contains) operator regardless of any operator prefix.
            Examples: `john`, `admin`
          schema:
            type: string
        - name: group_id
          in: query
          description: |-
            Filter by group membership (legacy parameter).
            Internally converted to `is_member_of_group` filter with `=` operator.
            Value is the group ID.
          schema:
            type: string
        - name: auth_source_id
          in: query
          description: |-
            Filter by authentication source. Undocumented
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none)
            Examples: `1`, `!1`
          schema:
            type: string
        - name: twofa_scheme
          in: query
          description: |-
            Filter by two-factor authentication scheme. Undocumented
            Format: `[operator]value[|value2|...]`
            Operators: `=` (default), `!` (not equal), `*` (any), `!*` (none)
            Only available when two-factor authentication is enabled in Redmine settings.
          schema:
            type: string
        - name: login
          in: query
          description: |-
            Filter by login. Undocumented
            Format: `[operator]value`
            Operators: `=` (equality, default), `~` (contains), `*~` (contains any word), `!~` (does not contain), `!` (not equal), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~admin`, `^john`
          schema:
            type: string
        - name: firstname
          in: query
          description: |-
            Filter by first name. Undocumented
            Format: `[operator]value`
            Operators: `=` (equality, default), `~` (contains), `*~` (contains any word), `!~` (does not contain), `!` (not equal), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~John`, `=John`
          schema:
            type: string
        - name: lastname
          in: query
          description: |-
            Filter by last name. Undocumented
            Format: `[operator]value`
            Operators: `=` (equality, default), `~` (contains), `*~` (contains any word), `!~` (does not contain), `!` (not equal), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~Doe`, `=Doe`
          schema:
            type: string
        - name: mail
          in: query
          description: |-
            Filter by email address. Undocumented
            Format: `[operator]value`
            Operators: `=` (equality, default), `~` (contains), `*~` (contains any word), `!~` (does not contain), `!` (not equal), `^` (starts with), `$` (ends with), `*` (any), `!*` (none)
            Examples: `~example.com`, `$@example.com`
          schema:
            type: string
        - name: created_on
          in: query
          description: |-
            Filter by creation date. Undocumented
            Format: `[operator]value`
            Operators: `=` (on date), `>=`, `<=`, `><` (between, pipe-separated), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `t-` (n days ago), `t` (today), `ld` (yesterday), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `m` (this month), `lm` (last month), `y` (this year), `*` (any), `!*` (none)
            Examples: `>=2024-01-01`, `>t-30`, `lm`
          schema:
            type: string
        - name: last_login_on
          in: query
          description: |-
            Filter by last login date. Undocumented
            Format: `[operator]value`
            Operators: `=` (on date), `>=`, `<=`, `><` (between, pipe-separated), `>t-` (on or after n days ago), `<t-` (on or before n days ago), `><t-` (from n days ago through today), `t-` (n days ago), `t` (today), `ld` (yesterday), `w` (this week), `lw` (last week), `l2w` (last 2 weeks), `m` (this month), `lm` (last month), `y` (this year), `*` (any), `!*` (none)
            Examples: `>=2024-01-01`, `>t-30`, `!*`
          schema:
            type: string
        - name: admin
          in: query
          description: |-
            Filter by admin privilege. Undocumented
            Format: `[operator]value`
            Operators: `=` (default), `!` (not equal)
            Values: `1` (admin), `0` (non-admin)
            Examples: `1`, `!1`
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/query_id'
        - $ref: '#/components/parameters/filter_fields'
        - $ref: '#/components/parameters/filter_operators'
        - $ref: '#/components/parameters/filter_values'
        - $ref: '#/components/parameters/custom_filters'
        - name: is_member_of_group
          in: query
          description: Filter by group membership. Supports `=` (default), `!`, `*` and `!*`; separate group IDs with pipes. Unlike the legacy `group_id` shortcut, this filter accepts operators.
          schema:
            type: string
        - name: sort
          in: query
          description: 'Comma-separated list of up to three field names, optionally followed by :asc or :desc. The default direction is ascending. Stock fields: login, firstname, lastname, mail, admin, created_on, updated_on, last_login_on, passwd_changed_on, status, auth_source.name. Sortable custom-field columns use cf_<id>. Example: login:desc. The twofa_scheme field is available when two-factor authentication is enabled.'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/user.summary'
                  total_count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The saved query was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/framework_error'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: Returned when a filter parameter has an invalid value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      description: |-
        Lists visible records. The default status filter selects active records. A saved query or explicit filters can select other statuses.
        Requires an administrator.
      security:
        - Basic: []
        - ApiKey: []
        - ApiKeyInQuery: []
        - OAuth2: []
