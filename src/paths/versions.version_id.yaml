parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/version_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Versions
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Versions#GET-2
  summary: Show version
  operationId: getVersion
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - version
            properties:
              version:
                $ref: ../components/schemas/version.yaml
    404:
      description: ""

put:
  tags:
    - Versions
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Versions#PUT
  summary: Update version
  operationId: updateVersion
  requestBody:
    $ref: ../components/request_bodies/update_version.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Versions
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Versions#DELETE
  summary: Delete version
  operationId: deleteVersion
  responses:
    204:
      description: ""
    422:
      description: Returned without a body when the version is not deletable (e.g. issues are assigned to it).
    404:
      description: ""
patch:
  tags:
    - Versions
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Versions#PUT
  summary: Update version (PATCH)
  operationId: updateVersionViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_version.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
