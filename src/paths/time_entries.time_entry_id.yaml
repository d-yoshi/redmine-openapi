parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/time_entry_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Time Entries
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_TimeEntries#Showing-a-time-entry
  summary: Show time entry
  operationId: getTimeEntry
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - time_entry
            properties:
              time_entry:
                $ref: ../components/schemas/time_entry.yaml
    404:
      description: ""

put:
  tags:
    - Time Entries
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_TimeEntries#Updating-a-time-entry
  summary: Update time entry
  operationId: updateTimeEntry
  requestBody:
    $ref: ../components/request_bodies/update_time_entry.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Time Entries
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_TimeEntries#Deleting-a-time-entry
  summary: Delete time entry
  operationId: deleteTimeEntry
  responses:
    204:
      description: ""
    422:
      description: ""
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.yaml
    404:
      description: ""

patch:
  tags:
    - Time Entries
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_TimeEntries#Updating-a-time-entry
  summary: Update time entry (PATCH)
  operationId: updateTimeEntryViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_time_entry.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
