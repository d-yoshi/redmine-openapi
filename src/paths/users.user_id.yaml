parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/user_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Users
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Users#GET-2
  summary: Show user
  operationId: getUser
  parameters:
    - name: include
      in: query
      description: |-
        Comma-separated list of associated data to include in the response.
        Values: `memberships` (project memberships with roles, limited to projects visible to the current user), `groups` (groups the user belongs to), `auth_source` (authentication source information)
      schema:
        type: array
        items:
          type: string
          enum:
            - memberships
            - groups
            - auth_source
      explode: false
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - user
            properties:
              user:
                $ref: ../components/schemas/user.yaml
    404:
      description: ""

put:
  tags:
    - Users
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Users#PUT
  summary: Update user
  operationId: updateUser
  requestBody:
    $ref: ../components/request_bodies/update_user.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
  security:
    - Basic: []
    - ApiKey: []
    - ApiKeyInQuery: []
    - OAuth2: []
  description: Requires an administrator.

delete:
  tags:
    - Users
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Users#DELETE
  summary: Delete user
  operationId: deleteUser
  responses:
    204:
      description: ""
    422:
      description: Returned without a body when the user tries to delete their own account and it is not deletable (e.g. the only active administrator).
    404:
      description: ""
  security:
    - Basic: []
    - ApiKey: []
    - ApiKeyInQuery: []
    - OAuth2: []
  description: Requires an administrator.

patch:
  tags:
    - Users
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Users#PUT
  summary: Update user (PATCH)
  operationId: updateUserViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_user.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  security:
    - Basic: []
    - ApiKey: []
    - ApiKeyInQuery: []
    - OAuth2: []
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior. Requires an administrator.
