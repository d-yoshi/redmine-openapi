parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/membership_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Project Memberships
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#GET-2
  summary: Show membership
  operationId: getMembership
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - membership
            properties:
              membership:
                $ref: ../components/schemas/membership.yaml
    404:
      description: ""

put:
  tags:
    - Project Memberships
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#PUT
  summary: Update membership
  operationId: updateMembership
  requestBody:
    $ref: ../components/request_bodies/update_membership.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Project Memberships
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#DELETE
  summary: Delete membership
  operationId: deleteMembership
  responses:
    204:
      description: ""
    422:
      description: Returned without a body when the membership is not deletable (e.g. inherited from a group).
    404:
      description: ""
patch:
  tags:
    - Project Memberships
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#PUT
  summary: Update membership (PATCH)
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
  operationId: updateMembershipViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_membership.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
