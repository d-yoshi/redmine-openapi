parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/project_id.yaml
  - $ref: ../components/parameters/path/wiki_page_title.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Wiki Pages
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_WikiPages#Getting-a-wiki-page
  summary: Show wiki page
  operationId: getWikiPage
  parameters:
    - name: include
      in: query
      description: |-
        Comma-separated list of associated data to include in the response.
        Values: `attachments` (file attachments)
      schema:
        type: array
        items:
          type: string
          enum:
            - attachments
      explode: false
    - name: version
      in: query
      description: Historical content version; an alternative to the versioned page path.
      schema:
        type: integer
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - wiki_page
            properties:
              wiki_page:
                $ref: ../components/schemas/wiki_page.yaml
    404:
      description: ""
    "302":
      $ref: ../components/responses.yaml#/WikiRedirect

put:
  tags:
    - Wiki Pages
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_WikiPages#Creating-or-updating-a-wiki-page
  summary: Create or update wiki page
  operationId: updateWikiPage
  requestBody:
    $ref: ../components/request_bodies/update_wiki_page.yaml
  responses:
    "201":
      $ref: ../components/responses.yaml#/WikiPageCreated
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "409":
      $ref: ../components/responses.yaml#/WikiContentConflict
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Wiki Pages
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_WikiPages#Deleting-a-wiki-page
  summary: Delete wiki page
  operationId: deleteWikiPage
  responses:
    204:
      description: ""
    404:
      description: ""
    "302":
      $ref: ../components/responses.yaml#/WikiRedirect
  description: When the requested title refers to a redirect, Redmine returns 302 without deleting the page. Send the DELETE request to the current title to delete the page.
patch:
  tags:
    - Wiki Pages
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_WikiPages#Creating-or-updating-a-wiki-page
  summary: Create or update wiki page (PATCH)
  operationId: updateWikiPageViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_wiki_page.yaml
  responses:
    "201":
      $ref: ../components/responses.yaml#/WikiPageCreated
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "409":
      $ref: ../components/responses.yaml#/WikiContentConflict
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
