parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/attachment_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Attachments
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Attachments#GET
  summary: Show attachment
  operationId: getAttachment
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - attachment
            properties:
              attachment:
                $ref: ../components/schemas/attachment.yaml
    404:
      description: ""

patch:
  tags:
    - Attachments
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Attachments#PATCH
  summary: Update attachment
  operationId: updateAttachment
  requestBody:
    $ref: ../components/request_bodies/update_attachment.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Attachments
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Attachments#DELETE
  summary: Delete attachment
  operationId: deleteAttachment
  responses:
    204:
      description: ""
    404:
      description: ""

put:
  tags:
    - Attachments
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Attachments#PATCH
  summary: Update attachment (PUT)
  operationId: updateAttachmentViaPut
  requestBody:
    $ref: ../components/request_bodies/update_attachment.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PATCH on this path, including its permission requirements and request/response behavior.
