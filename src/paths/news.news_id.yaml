parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/news_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - News
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_News#Showing-a-news-item
  summary: Show news
  operationId: getNews
  parameters:
    - name: include
      in: query
      description: |-
        Comma-separated list of associated data to include in the response.
        Values: `attachments` (file attachments), `comments` (comments/replies on the news item)
      schema:
        type: array
        items:
          type: string
          enum:
            - attachments
            - comments
      explode: false
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - news
            properties:
              news:
                $ref: ../components/schemas/news.yaml
    404:
      description: ""

put:
  tags:
    - News
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_News#Updating-a-news-item
  summary: Update news
  operationId: updateNews
  requestBody:
    $ref: ../components/request_bodies/update_news.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - News
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_News#Deleting-a-news-item
  summary: Delete news
  operationId: deleteNews
  responses:
    204:
      description: ""
    404:
      description: ""
patch:
  tags:
    - News
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_News#Updating-a-news-item
  summary: Update news (PATCH)
  operationId: updateNewsViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_news.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
