get:
  tags:
    - Attachments
  summary: Download thumbnail
  description: The same thumbnail is available at `/attachments/thumbnail/{attachment_id}/{size}`. The size in the path takes precedence over the query parameter.
  operationId: downloadThumbnail
  parameters:
    - $ref: ../components/parameters/path/attachment_id.yaml
    - $ref: ../components/parameters/header/x_redmine_switch_user.yaml
    - name: size
      in: query
      description: |-
        Desired thumbnail size in pixels (max 800). Rounded up to the nearest 50px increment.
        If not specified, the configured default thumbnail size is used.
      schema:
        type: integer
    - name: If-None-Match
      in: header
      description: ETag from a previous response. Redmine returns 304 with no response body when the tag matches.
      schema:
        type: string
  responses:
    200:
      description: |-
        Redmine selects the thumbnail's `Content-Type` from the attachment's `content_type`, inferring the media type from the filename when `content_type` is empty or `application/octet-stream`.
        The response uses `image/png` for non-image media types.
      content:
        image/*:
          schema:
            type: string
            format: binary
      headers:
        ETag:
          description: Use this value with `If-None-Match` to make a conditional request.
          schema:
            type: string
    "404":
      description: "If the attachment does not exist, the error format depends on `Accept`: an empty body for JSON or an HTML error page for HTML. If the attachment exists but cannot be thumbnailed, the body is empty."
      content:
        application/json:
          schema:
            type: object
            nullable: true
            additionalProperties: false
            description: The response body is empty.
        text/html:
          schema:
            type: string
            format: binary
    "304":
      description: The ETag matches; no response body is sent.
    "302":
      description: Redirects to the sign-in page when an anonymous request cannot access the attachment.
      headers:
        Location:
          description: Sign-in URL.
          schema:
            type: string
    "403":
      description: "Empty response body for `Accept: application/json`; an HTML access-denied page for browser-style requests."
      content:
        application/json:
          schema:
            type: object
            nullable: true
            additionalProperties: false
            description: The response body is empty.
        text/html:
          schema:
            type: string
            format: binary
