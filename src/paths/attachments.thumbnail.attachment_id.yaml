get:
  tags:
    - Attachments
  summary: Download thumbnail
  description: "Undocumented: This operation is not listed in the official documentation."
  operationId: downloadThumbnail
  parameters:
    - $ref: ../components/parameters/path/attachment_id.yaml
    - $ref: ../components/parameters/header/x_redmine_switch_user.yaml
    - name: size
      in: query
      description: |-
        Desired thumbnail size in pixels (max 800). Rounded up to the nearest 50px increment.
        If not specified, the configured default thumbnail size is used.
      schema:
        type: integer
  responses:
    200:
      description: |-
        Redmine selects the thumbnail's `Content-Type` from the attachment's `content_type`, inferring the media type from the filename when `content_type` is empty or `application/octet-stream`.
        The response uses `image/png` for `application/pdf` and preserves other media types.
      content:
        "*/*":
          schema:
            type: string
            format: binary
    404:
      description: The body is empty for clients sending Accept:application/json; browsers (Accept:*/*) receive an HTML error page instead.
