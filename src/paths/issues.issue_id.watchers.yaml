post:
  tags:
    - Issues
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Adding-a-watcher
  summary: Add watcher
  description: Adds a user or regular group as a watcher. Unknown IDs are ignored and still return 204. A nonexistent issue returns 403.
  operationId: addWatcher
  parameters:
    - $ref: ../components/parameters/path/format.yaml
    - $ref: ../components/parameters/path/issue_id.yaml
    - $ref: ../components/parameters/header/x_redmine_switch_user.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            user_id:
              type: integer
              description: User or regular group ID. Ignored when `watcher` is present.
            watcher:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: integer
                user_ids:
                  type: array
                  items:
                    type: integer
              description: Provide `user_id` for one user or regular group, or `user_ids` for several.
          allOf:
            # Declare each required key as a property so generators can retain the alternatives.
            - anyOf:
                - required: [user_id]
                  properties:
                    user_id: {}
                - required: [watcher]
                  properties:
                    watcher: {}
  responses:
    204:
      description: ""
