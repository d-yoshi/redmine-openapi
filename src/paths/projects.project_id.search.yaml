get:
  tags:
    - Search
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Search#GET
  summary: Search within project
  operationId: getSearchByProject
  parameters:
    - $ref: ../components/parameters/path/format.yaml
    - $ref: ../components/parameters/path/project_id.yaml
    - $ref: ../components/parameters/query/limit.yaml
    - $ref: ../components/parameters/query/offset.yaml
    - $ref: ../components/parameters/query/nometa.yaml
    - $ref: ../components/parameters/header/x_redmine_switch_user.yaml
    - $ref: ../components/parameters/header/x_redmine_nometa.yaml
    - name: q
      in: query
      description: 'Search query split into at most five unique tokens; quoted phrases form one token. Non-Han tokens need at least two characters, while a Han character can be a token. If the query is omitted or has no usable tokens, Redmine returns an empty result and `total_count: null`. By default, all tokens must match; use `all_words` to allow any token to match.'
      schema:
        type: string
    - name: scope
      in: query
      description: Defaults to the project in the path. `subprojects` includes that project and its descendants. `all`, `my_projects`, and `bookmarks` replace this context with all visible projects, projects the current user belongs to, or the current user's bookmarked projects, respectively.
      schema:
        type: string
        enum:
          - all
          - my_projects
          - bookmarks
          - subprojects
    - name: all_words
      in: query
      description: |-
        Require all words to match. Default is `true` (all words must match).
        Set to empty string to disable (any word matches). Any non-empty value enables this option.
      schema:
        type: string
    - name: titles_only
      in: query
      description: |-
        Search titles only. Default is `false`.
        Any non-empty value enables this option.
      schema:
        type: string
    - name: issues
      in: query
      description: |-
        Include issues in search results. Any non-empty value enables this search type.
        If no search type parameters are specified, all types are searched.
      schema:
        type: integer
        enum:
          - 1
    - name: news
      in: query
      description: |-
        Include news in search results. Any non-empty value enables this search type.
        If no search type parameters are specified, all types are searched.
      schema:
        type: integer
        enum:
          - 1
    - name: wiki_pages
      in: query
      description: |-
        Include wiki pages in search results. Any non-empty value enables this search type.
        If no search type parameters are specified, all types are searched.
      schema:
        type: integer
        enum:
          - 1
    - name: documents
      in: query
      description: |-
        Include documents in search results. Any non-empty value enables this search type.
        If no search type parameters are specified, all types are searched.
      schema:
        type: integer
        enum:
          - 1
    - name: changesets
      in: query
      description: |-
        Include changesets in search results. Any non-empty value enables this search type.
        If no search type parameters are specified, all types are searched.
      schema:
        type: integer
        enum:
          - 1
    - name: messages
      in: query
      description: |-
        Include forum messages in search results. Any non-empty value enables this search type.
        If no search type parameters are specified, all types are searched.
      schema:
        type: integer
        enum:
          - 1
    - name: open_issues
      in: query
      description: |-
        Only return open issues. Default is `false`.
        Any non-empty value enables this option.
      schema:
        type: string
    - name: attachments
      in: query
      description: Search attachment metadata (filenames and descriptions) associated with searchable records; file contents are not searched. `0` (default) searches record fields only, `1` searches record fields and attachment metadata, and `only` searches attachment metadata only. If `titles_only` is enabled, attachment metadata is searched only when this parameter is `only`.
      schema:
        type: string
        enum:
          - "0"
          - "1"
          - "only"
    - $ref: ../components/parameters/query/page.yaml
    - name: projects
      in: query
      description: Include matching projects when the effective scope covers multiple projects or is global. Any non-empty value enables project results.
      schema:
        type: integer
        enum:
          - 1
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - results
            properties:
              results:
                type: array
                items:
                  $ref: ../components/schemas/search.yaml
              total_count:
                type: integer
                nullable: true
              offset:
                type: integer
              limit:
                type: integer
    404:
      description: ""
