parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/issue_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Issues
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Showing-an-issue
  summary: Show issue
  operationId: getIssue
  parameters:
    - name: include
      in: query
      description: |-
        Comma-separated list of associated data to include in the response.
        Values: `children` (child issues and their descendants, limited to issues visible to the current user), `attachments` (file attachments), `relations` (issue relations), `changesets` (associated VCS changesets), `journals` (change history and notes), `watchers` (users watching the issue), `allowed_statuses` (status transitions available for the current user)
        The `children` field is omitted for leaf issues. For non-leaf issues, it may be empty when none of their children are visible.
      schema:
        type: array
        items:
          type: string
          enum:
            - children
            - attachments
            - relations
            - changesets
            - journals
            - watchers
            - allowed_statuses
      explode: false
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - issue
            properties:
              issue:
                $ref: ../components/schemas/issue.yaml
    404:
      description: ""

put:
  tags:
    - Issues
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Updating-an-issue
  summary: Update issue
  operationId: updateIssue
  requestBody:
    $ref: ../components/request_bodies/update_issue.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Issues
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Deleting-an-issue
  summary: Delete issue
  operationId: deleteIssue
  parameters:
    - $ref: ../components/parameters/query/issue_delete_todo.yaml
    - $ref: ../components/parameters/query/issue_delete_reassign_to_id.yaml
  responses:
    204:
      description: ""
    404:
      description: ""

patch:
  tags:
    - Issues
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Issues#Updating-an-issue
  summary: Update issue (PATCH)
  operationId: updateIssueViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_issue.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
