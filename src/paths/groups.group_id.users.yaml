post:
  tags:
    - Groups
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Groups#POST-2
  summary: Add user to group
  operationId: addUserToGroup
  parameters:
    - $ref: ../components/parameters/path/format.yaml
    - $ref: ../components/parameters/path/group_id.yaml
    - $ref: ../components/parameters/header/x_redmine_switch_user.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            user_id:
              type: integer
            user_ids:
              type: array
              items:
                type: integer
          description: Provide `user_id` for one user or `user_ids` for several users. Unknown user IDs are ignored.
  responses:
    204:
      description: ""
    422:
      description: ""
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.yaml
    404:
      description: ""
  security:
    - Basic: []
    - ApiKey: []
    - ApiKeyInQuery: []
    - OAuth2: []
  description: Requires an administrator.
