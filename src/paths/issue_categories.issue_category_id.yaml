parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/issue_category_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Issue Categories
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_IssueCategories#GET-2
  summary: Show issue category
  operationId: getIssueCategory
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - issue_category
            properties:
              issue_category:
                $ref: ../components/schemas/issue_category.yaml
    404:
      description: ""

put:
  tags:
    - Issue Categories
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_IssueCategories#PUT
  summary: Update issue category
  operationId: updateIssueCategory
  requestBody:
    $ref: ../components/request_bodies/update_issue_category.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Issue Categories
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_IssueCategories#DELETE
  summary: Delete issue category
  operationId: deleteIssueCategory
  parameters:
    - name: reassign_to_id
      in: query
      description: |-
        ID of another issue category to reassign issues to before deleting this category.
        If the category has associated issues and this parameter is not provided, the issues will have their category unset.
      schema:
        type: integer
  responses:
    204:
      description: ""
    404:
      description: ""

patch:
  tags:
    - Issue Categories
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_IssueCategories#PUT
  summary: Update issue category (PATCH)
  operationId: updateIssueCategoryViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_issue_category.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
