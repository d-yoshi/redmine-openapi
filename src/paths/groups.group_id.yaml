parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/group_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Groups
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Groups#GET-2
  summary: Show group
  operationId: getGroup
  parameters:
    - name: include
      in: query
      description: |-
        Comma-separated list of associated data to include in the response.
        Values: `users` (list of users in the group), `memberships` (project memberships with roles, limited to projects visible to the current user)
      schema:
        type: array
        items:
          type: string
          enum:
            - users
            - memberships
      explode: false
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - group
            properties:
              group:
                $ref: ../components/schemas/group.yaml
    404:
      description: ""

put:
  tags:
    - Groups
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Groups#PUT
  summary: Update group
  operationId: updateGroup
  requestBody:
    $ref: ../components/request_bodies/update_group.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
  security:
    - Basic: []
    - ApiKey: []
    - ApiKeyInQuery: []
    - OAuth2: []
  description: Requires an administrator.

delete:
  tags:
    - Groups
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Groups#DELETE
  summary: Delete group
  operationId: deleteGroup
  responses:
    204:
      description: ""
    404:
      description: ""
  security:
    - Basic: []
    - ApiKey: []
    - ApiKeyInQuery: []
    - OAuth2: []
  description: Requires an administrator.

patch:
  tags:
    - Groups
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Groups#PUT
  summary: Update group (PATCH)
  operationId: updateGroupViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_group.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  security:
    - Basic: []
    - ApiKey: []
    - ApiKeyInQuery: []
    - OAuth2: []
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior. Requires an administrator.
