parameters:
  - $ref: ../components/parameters/path/format.yaml
  - $ref: ../components/parameters/path/project_id.yaml
  - $ref: ../components/parameters/header/x_redmine_switch_user.yaml

get:
  tags:
    - Projects
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Projects#Showing-a-project
  summary: Show project
  operationId: getProject
  parameters:
    - name: include
      in: query
      description: |-
        Comma-separated list of associated data to include in the response.
        Values: `trackers` (available issue trackers), `issue_categories` (issue categories), `time_entry_activities` (time entry activity types), `enabled_modules` (enabled modules/features), `issue_custom_fields` (custom fields for issues)
      schema:
        type: array
        items:
          type: string
          enum:
            - trackers
            - issue_categories
            - time_entry_activities
            - enabled_modules
            - issue_custom_fields
      explode: false
  responses:
    200:
      description: ""
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - project
            properties:
              project:
                $ref: ../components/schemas/project.yaml
    404:
      description: ""
  description: Authenticated users, including administrators, receive 403 for archived projects.

put:
  tags:
    - Projects
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Projects#Updating-a-project
  summary: Update project
  operationId: updateProject
  requestBody:
    $ref: ../components/request_bodies/update_project.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound

delete:
  tags:
    - Projects
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Projects#Deleting-a-project
  summary: Delete project
  operationId: deleteProject
  responses:
    204:
      description: ""
    404:
      description: ""
patch:
  tags:
    - Projects
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Projects#Updating-a-project
  summary: Update project (PATCH)
  operationId: updateProjectViaPatch
  requestBody:
    $ref: ../components/request_bodies/update_project.yaml
  responses:
    "204":
      $ref: ../components/responses.yaml#/NoContent
    "404":
      $ref: ../components/responses.yaml#/ResourceNotFound
    "422":
      $ref: ../components/responses.yaml#/ValidationErrors
  description: Equivalent to PUT on this path, including its permission requirements and request/response behavior.
