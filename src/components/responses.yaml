Unauthorized:
  description: Authentication is required by the operation, installation settings or resource permissions. Invalid credentials also return 401. API-key and Basic authentication return 403 when REST API authentication is disabled.

Forbidden:
  description: The current user, including an anonymous user, lacks permission for the action or resource.

PreconditionFailed:
  description: Invalid X-Redmine-Switch-User header. Returns 412 when the specified user does not exist or is not active. Only applicable to admin users using the X-Redmine-Switch-User header.
WikiRedirect:
  description: The requested Wiki title redirects to the page at its current title. This occurs when a redirect remains after a rename or move, including when the configured start-page title refers to a redirect.
  headers:
    Location:
      description: Target page URL. The URL may omit the `.json` suffix; the response format at that URL can depend on the client's Accept header.
      schema:
        type: string
NoContent:
  description: The request was completed successfully; no response body is returned.
ResourceNotFound:
  description: The requested resource was not found or is not visible.
ValidationErrors:
  description: The request could not be completed. The response lists the reasons.
  content:
    application/json:
      schema:
        $ref: ./schemas/errors.yaml
WikiContentConflict:
  description: The supplied content version conflicts with the current Wiki content version.
WikiPageCreated:
  description: The Wiki page was created.
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required:
          - wiki_page
        properties:
          wiki_page:
            $ref: ./schemas/wiki_page.yaml
