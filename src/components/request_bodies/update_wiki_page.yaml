required: true
content:
  application/json:
    schema:
      type: object
      additionalProperties: false
      required:
        - wiki_page
      properties:
        wiki_page:
          type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
            comments:
              type: string
            version:
              description: Content version for optimistic locking. When `text` changes, a supplied version that differs from the current content version causes a 409 Conflict response. Unchanged text does not cause a version conflict.
              type: integer
            parent_title:
              description: Title of the parent wiki page. Sets this page as a child in the page hierarchy.
              type: string
            title:
              description: New title for the page (rename). Requires the rename_wiki_pages permission.
              type: string
            redirect_existing_links:
              description: When a page is renamed using `title`, this parameter controls whether the old title redirects to the new one. Only the string `"0"` disables the redirect; all other values, including the boolean `false`, leave it enabled.
              type: string
              enum:
                - "0"
                - "1"
            is_start_page:
              description: Set to `true` to make this page the wiki start page. When renaming the current start page, Redmine updates the configured start-page title if this parameter is omitted. Setting it to `false` preserves the previous title. Requires the `manage_wiki` permission.
              type: boolean
            deleted_attachment_ids:
              type: array
              items:
                type: integer
            uploads:
              $ref: ../schemas/request/uploads.yaml
