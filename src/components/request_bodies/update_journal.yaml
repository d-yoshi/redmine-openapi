content:
  application/json:
    schema:
      type: object
      additionalProperties: false
      properties:
        journal:
          type: object
          additionalProperties: false
          properties:
            notes:
              type: string
              nullable: true
              description: A journal with empty `notes` and no property changes (`details`) remains editable but is omitted from the issue's `include=journals` response until notes are added.
            private_notes:
              description: Mark the notes as private. Private notes are visible to their author and users with the View private notes permission.
              type: boolean
