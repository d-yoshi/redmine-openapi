content:
  application/json:
    schema:
      type: object
      additionalProperties: false
      properties:
        project:
          type: object
          additionalProperties: false
          properties:
            identifier:
              type: string
              description: |-
                Redmine accepts this field but ignores changes to an existing project's identifier.
            name:
              type: string
            description:
              type: string
              nullable: true
            homepage:
              type: string
              nullable: true
            is_public:
              type: boolean
              description: Requires the Set project public or private permission.
            parent_id:
              type: integer
              nullable: true
            inherit_members:
              description: Inherit members from the parent project. Applies to subprojects. The current user needs the Manage members permission for this project and must be able to view its existing parent.
              type: boolean
            default_assigned_to_id:
              description: Default assignee for new issues in this project. Set to null to clear.
              type: integer
              nullable: true
            default_version_id:
              description: Default target version for new issues in this project. Set to null to clear.
              type: integer
              nullable: true
            default_issue_query_id:
              description: Default saved query for the project's issue list page. Set to null to clear.
              type: integer
              nullable: true
            tracker_ids:
              description: IDs of trackers available in this project.
              type: array
              items:
                type: integer
            enabled_module_names:
              description: |-
                Enabled module names for this project.
                Requires the Select project modules permission.
                Values: `issue_tracking`, `time_tracking`, `news`, `documents`, `files`, `wiki`, `repository`, `boards`, `calendar`, `gantt`
              type: array
              items:
                type: string
            issue_custom_field_ids:
              description: IDs of issue custom fields enabled for this project. Custom fields with `is_for_all=true` are always available regardless of this setting.
              type: array
              items:
                type: integer
            custom_fields:
              $ref: ../schemas/request/custom_fields.yaml
            custom_field_values:
              $ref: ../schemas/request/custom_field_values.yaml
