type: object
additionalProperties: false
required:
  - id
  - login
  - admin
  - firstname
  - lastname
  - mail
  - created_on
  - updated_on
  - last_login_on
  - passwd_changed_on
  - twofa_scheme
  - status
properties:
  id:
    type: integer
  login:
    type: string
  admin:
    type: boolean
    description: Returned when the current user is an administrator or is viewing their own record.
  firstname:
    type: string
  lastname:
    type: string
  mail:
    type: string
    description: Returned when the current user is an administrator or the user represented by this record has not hidden their email address.
  created_on:
    type: string
    format: date-time
  updated_on:
    type: string
    format: date-time
  last_login_on:
    type: string
    format: date-time
    nullable: true
  passwd_changed_on:
    type: string
    format: date-time
    nullable: true
  avatar_url:
    type: string
    description: Returned when Gravatar icons are enabled.
  twofa_scheme:
    type: string
    nullable: true
    description: Returned when the current user is an administrator or is viewing their own record.
  status:
    type: integer
    description: Returned to administrators.
  auth_source:
    description: Included for administrators when requested and this user has an external authentication source.
    allOf:
      - $ref: ./id_name.yaml
  custom_fields:
    type: array
    items:
      $ref: ./custom_field_value.yaml
    description: Visible custom-field values. Omitted when no custom fields are visible.
