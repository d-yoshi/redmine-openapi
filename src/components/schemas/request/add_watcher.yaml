type: object
additionalProperties: false
anyOf:
  - required: [user_id]
  - required: [watcher]
properties:
  user_id:
    type: integer
    description: User or regular group ID. Ignored when `watcher` is present.
  watcher:
    type: object
    additionalProperties: false
    properties:
      user_id:
        type: integer
      user_ids:
        type: array
        items:
          type: integer
    description: Provide `user_id` for one user or regular group, or `user_ids` for several.
