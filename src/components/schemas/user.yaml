type: object
additionalProperties: false
required:
  - id
  - login
  - firstname
  - lastname
  - created_on
  - updated_on
  - last_login_on
  - passwd_changed_on
properties:
  id:
    type: integer
  login:
    type: string
  admin:
    type: boolean
    description: Returned when the current user is an administrator or is viewing their own record.
  firstname:
    type: string
  lastname:
    type: string
  mail:
    type: string
    description: Returned when the current user is an administrator or the user represented by this record has not hidden their email address.
  created_on:
    type: string
    format: date-time
  updated_on:
    type: string
    format: date-time
  last_login_on:
    type: string
    format: date-time
    nullable: true
  passwd_changed_on:
    type: string
    format: date-time
    nullable: true
  avatar_url:
    type: string
    description: Returned when Gravatar icons are enabled.
  twofa_scheme:
    type: string
    nullable: true
    description: Returned when the current user is an administrator or is viewing their own record.
  api_key:
    type: string
    description: Returned when the current user is an administrator, or is viewing their own record without OAuth authentication.
  status:
    type: integer
    description: Returned to administrators.
  custom_fields:
    type: array
    items:
      $ref: ./custom_field_value.yaml
    description: Visible custom-field values. Omitted when no custom fields are visible.
  auth_source:
    description: Included for administrators when requested and this user has an external authentication source.
    allOf:
      - $ref: ./id_name.yaml
  groups:
    type: array
    items:
      $ref: ./id_name.yaml
    description: Included for administrators when requested.
  memberships:
    description: Project memberships visible to the current user. Memberships in archived projects are excluded.
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - project
        - roles
      properties:
        id:
          type: integer
        project:
          $ref: ./id_name.yaml
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
            properties:
              id:
                type: integer
              name:
                type: string
              inherited:
                type: boolean
