type: object
additionalProperties: false
required:
  - id
  - project
  - tracker
  - status
  - priority
  - author
  - subject
  - description
  - start_date
  - due_date
  - done_ratio
  - is_private
  - estimated_hours
  - total_estimated_hours
  - created_on
  - updated_on
  - closed_on
properties:
  id:
    type: integer
  project:
    $ref: ./id_name.yaml
  tracker:
    $ref: ./id_name.yaml
  status:
    $ref: ./issue_status.summary.yaml
  priority:
    $ref: ./id_name.yaml
  author:
    $ref: ./id_name.yaml
  assigned_to:
    $ref: ./id_name.yaml
  category:
    $ref: ./id_name.yaml
  fixed_version:
    $ref: ./id_name.yaml
  parent:
    type: object
    additionalProperties: false
    required:
      - id
    properties:
      id:
        type: integer
  subject:
    type: string
  description:
    type: string
    nullable: true
  start_date:
    type: string
    format: date
    nullable: true
  due_date:
    type: string
    format: date
    nullable: true
  done_ratio:
    type: integer
    minimum: 0
    maximum: 100
  is_private:
    type: boolean
  estimated_hours:
    type: number
    nullable: true
  total_estimated_hours:
    type: number
    nullable: true
  spent_hours:
    type: number
    description: Returned when the current user can view spent time in the project.
  total_spent_hours:
    type: number
    description: Returned when the current user can view spent time in the project.
  custom_fields:
    type: array
    items:
      $ref: ./custom_field_value.yaml
    description: Visible custom-field values. Omitted when no custom fields are visible.
  created_on:
    type: string
    format: date-time
  updated_on:
    type: string
    format: date-time
  closed_on:
    type: string
    format: date-time
    nullable: true
  changesets:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - revision
        - comments
        - committed_on
      properties:
        revision:
          type: string
        user:
          $ref: ./id_name.yaml
        comments:
          type: string
        committed_on:
          type: string
          format: date-time
  children:
    type: array
    items:
      $ref: ./issue_child.yaml
    description: Included with `include=children` when descendants exist. Contains only visible descendants; an empty array is possible when all descendants are hidden.
  attachments:
    type: array
    items:
      $ref: ./attachment.yaml
  relations:
    type: array
    items:
      $ref: ./issue_relation.yaml
    description: Included with `include=relations`. Detail responses omit this array when the issue has no relations.
  journals:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - user
        - notes
        - created_on
        - updated_on
        - private_notes
        - details
      properties:
        id:
          type: integer
        user:
          $ref: ./id_name.yaml
        notes:
          type: string
          nullable: true
        created_on:
          type: string
          format: date-time
        updated_on:
          type: string
          format: date-time
        updated_by:
          $ref: ./id_name.yaml
        private_notes:
          type: boolean
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - property
              - name
              - old_value
              - new_value
            properties:
              property:
                type: string
              name:
                type: string
              old_value:
                type: string
                nullable: true
              new_value:
                type: string
                nullable: true
  watchers:
    type: array
    items:
      $ref: ./id_name.yaml
    description: Included with `include=watchers` when the current user can view issue watchers.
  allowed_statuses:
    type: array
    items:
      $ref: ./issue_status.summary.yaml
