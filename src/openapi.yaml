openapi: 3.0.3

info:
  title: Redmine API
  description: |-
    This unofficial OpenAPI specification describes the Redmine 6.1.6 REST API, covering JSON requests and responses, file uploads, attachment downloads, and thumbnails.

    Anonymous access depends on the Redmine instance's settings, project visibility, and permissions. This specification identifies operations that require authentication or administrator privileges.

    XML and JSONP responses are outside the scope of this specification. When JSONP support is enabled in Redmine, clients can request JSONP responses using the `callback` or `jsonp` query parameter. These parameters are not declared on individual operations.
  contact:
    name: d-yoshi/redmine-openapi
    url: https://github.com/d-yoshi/redmine-openapi
  license:
    name: MIT
    url: https://github.com/d-yoshi/redmine-openapi/blob/main/LICENSE
  version: 6.1.6-r4

servers:
  - url: /

externalDocs:
  description: Redmine API Official Developer Guide
  url: https://www.redmine.org/projects/redmine/wiki/Rest_api

security:
